base_config: configs/base.yaml
dataset_config: configs/datasets.yaml

run:
  dataset_name: local_jsonl_reasoning
  split: train
  validation_split: validation
  sft_mode: distilled_cot
  mixed_modes:
    distilled_cot: 0.7
    brief_reasoning: 0.3
  output_dir: outputs/sft/qwen35_4b_lora
  inject_rag: true
  statute_index_dir: data/statute_index
  rag_top_k: 5
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  max_seq_length: 4096
  packing: true

trainer:
  learning_rate: 2.0e-5
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true

lora:
  enabled: true
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - up_proj
    - down_proj
    - gate_proj
