project_name: legal-lm-cn
seed: 42

model:
  model_name_or_path: Qwen/Qwen3.5-4B-Instruct
  tokenizer_name_or_path: Qwen/Qwen3.5-4B-Instruct
  trust_remote_code: true
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16
  load_in_4bit: false

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  output_dir: outputs

prompt:
  system_prompt: |-
    你是一名审慎、准确、遵循中国法律文本的法律分析助手。
    你的回答必须以案件事实为基础，优先给出法律结论、法律依据、推理过程和不确定性提示。
    如果信息不足，应明确指出需要补充的事实，而不是编造结论。
  answer_template: |-
    【结论】
    {answer}

    【法律依据】
    {citations}

    【推理摘要】
    {reasoning}

    【风险提示】
    {caution}

  distilled_cot_template: |-
    【案件事实】
    {facts}

    【争点识别】
    {issues}

    【规则适用】
    {rules}

    【逐步推理】
    {reasoning}

    【结论】
    {answer}

    【风险提示】
    {caution}

evaluation:
  default_generation_max_new_tokens: 768
  default_temperature: 0.1
