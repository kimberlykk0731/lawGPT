base_config: configs/base.yaml
dataset_config: configs/datasets.yaml

run:
  train_file: data/processed/opd/train.jsonl
  validation_file: data/processed/opd/validation.jsonl
  output_dir: outputs/opd/qwen35_4b_lora
  max_seq_length: 4096
  packing: false

trainer:
  learning_rate: 1.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  weight_decay: 0.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
  eval_steps: 200

lora:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - up_proj
    - down_proj
    - gate_proj
