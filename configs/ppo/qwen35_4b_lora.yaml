base_config: configs/base.yaml
dataset_config: configs/datasets.yaml

run:
  train_file: data/processed/ppo/train.jsonl
  validation_file: data/processed/ppo/validation.jsonl
  output_dir: outputs/ppo/qwen35_4b_lora
  max_prompt_length: 1536
  max_completion_length: 768
  use_vllm: true
  vllm_server_host: 127.0.0.1
  vllm_server_port: 8000

trainer:
  learning_rate: 1.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  bf16: true
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 100
  kl_coef: 0.05
  cliprange: 0.2
  cliprange_value: 0.2
  vf_coef: 0.1

reward:
  reward_model_path: outputs/rm/qwen35_4b_lora
  rule_profile: general
  composite:
    weights:
      rule: 0.3
      learned: 0.7

lora:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
