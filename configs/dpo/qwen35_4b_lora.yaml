base_config: configs/base.yaml
dataset_config: configs/datasets.yaml

run:
  alignment_method: dpo
  dataset_name: local_jsonl_reasoning
  train_file: data/processed/preference/train.jsonl
  validation_file: data/processed/preference/validation.jsonl
  output_dir: outputs/dpo/qwen35_4b_lora
  max_prompt_length: 1536
  max_length: 4096

trainer:
  learning_rate: 5.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  beta: 0.1
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  loss_type: sigmoid

lora:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - up_proj
    - down_proj
    - gate_proj
