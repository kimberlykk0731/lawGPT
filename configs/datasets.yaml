datasets:
  local_jsonl_reasoning:
    loader: local_jsonl
    root: data/raw/local_reasoning
    description: "本地 JSONL 格式的中文法律推理数据。"
    domain: general
    task_type: case_reasoning
    split_files:
      train: train.jsonl
      validation: validation.jsonl
      test: test.jsonl

  cail2018:
    loader: cail
    root: data/raw/CAIL2018
    description: "CAIL2018 刑事判决预测数据。"
    domain: criminal
    task_type: judgment_prediction
    split_files:
      train: train.json
      validation: valid.json
      test: test.json

  jec_qa:
    loader: jec_qa
    root: data/raw/JEC-QA
    description: "JEC-QA 法考类法律问答数据。"
    domain: general
    task_type: qa
    split_files:
      train: train.json
      validation: valid.json
      test: test.json

  lecard_v2:
    loader: lecard_v2
    root: data/raw/LeCaRDv2
    description: "LeCaRDv2 中文法律类案检索数据。"
    domain: criminal
    task_type: retrieval
    split_files:
      train: train_query.json
      validation: test_query.json
      test: test_query.json
    candidate_dir: candidates
    qrels_file: relevence.trec
