[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-lm-cn"
version = "0.1.0"
description = "Chinese legal post-training pipeline: SFT + GRPO/DPO + MoE analysis + distillation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "datasets>=2.18",
  "huggingface_hub",
  "torch>=2.4",
  "transformers>=4.46",
  # trl 0.15+ removed GRPOConfig.vllm_device (switched to server-mode vLLM).
  # Our train_grpo.py uses the colocate-mode API; pin to <0.15 until we migrate.
  "trl>=0.13,<0.15",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
vllm = [
  # vllm < 0.7 lacks vllm.sampling_params.GuidedDecodingParams which
  # trl >= 0.13's GRPOTrainer imports unconditionally.
  "vllm>=0.7,<0.8",
]
deepspeed = [
  "deepspeed>=0.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stages*"]

[tool.ruff]
line-length = 100
target-version = "py310"
