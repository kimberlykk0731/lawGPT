[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-lm-cn"
version = "0.1.0"
description = "Chinese legal post-training pipeline: SFT + GRPO/DPO + MoE analysis + distillation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "datasets>=2.18",
  "huggingface_hub",
  "torch>=2.4",
  "transformers>=4.46",
  # Sweet spot is trl 0.16.x / 0.17.x: GRPOConfig has BOTH DAPO Clip-Higher
  # (`epsilon` / `epsilon_high`, added in 0.16) AND colocate-mode `vllm_device`
  # (removed in 0.18 in favour of `trl vllm-serve` server-mode). We use both,
  # so pin to <0.18.
  "trl>=0.16,<0.18",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
vllm = [
  # trl 0.17 vllm-serve uses EngineArgs.worker_extension_cls (added in vllm 0.8).
  # vllm 0.8 also pulls torch 2.6+ / cu124, which is what we run.
  "vllm>=0.8,<0.9",
]
deepspeed = [
  "deepspeed>=0.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stages*"]

[tool.ruff]
line-length = 100
target-version = "py310"
