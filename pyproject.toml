[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-lm-cn"
version = "0.1.0"
description = "Chinese legal post-training pipeline for SFT, DPO/ORPO, and GRPO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "datasets>=2.18",
  "jieba",
  "peft",
  "pyyaml",
  "scikit-learn",
  "torch>=2.4",
  "transformers>=4.46",
  "trl>=0.13",
  "openai>=1.30",
  "loguru",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
vllm = [
  "vllm>=0.6",
]
rag = [
  "faiss-cpu",
  "sentence-transformers",
]
serve = [
  "fastapi",
  "uvicorn",
  "gradio>=4.0",
  "httpx",
]
deepspeed = [
  "deepspeed>=0.15",
]
tracking = [
  "swanlab",
]
moe = [
  "mergekit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stages*"]

[tool.ruff]
line-length = 100
target-version = "py310"
