[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-lm-cn"
version = "0.1.0"
description = "Chinese legal post-training pipeline for SFT, DPO/ORPO, and GRPO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "datasets",
  "jieba",
  "peft",
  "pyyaml",
  "scikit-learn",
  "torch",
  "transformers",
  "trl",
  "openai>=1.30",
  "loguru",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
vllm = [
  "vllm",
]
rag = [
  "faiss-cpu",
  "sentence-transformers",
]
serve = [
  "fastapi",
  "uvicorn",
  "gradio>=4.0",
  "httpx",
]
deepspeed = [
  "deepspeed",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
