teacher: ckpts/legalgpt-8b-grpo
student_base: Qwen/Qwen3-1.7B

stage_a_blackbox:
  prompts_jsonl: data/processed/sft_350k/clean.jsonl
  output_jsonl: data/distilled/teacher_completions.jsonl
  temperature: 0.7
  top_p: 0.9
  max_tokens: 1024
  expected_runtime_a10: ~8h for 350k samples

stage_b_logits_kl:
  cache_path: data/distilled/teacher_top50_cache.pt
  top_k: 50
  temperature: 2.0
  alpha: 0.3
  num_train_epochs: 2
  learning_rate: 2.0e-5
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4

stage_c_onpolicy_kl:
  num_train_epochs: 3
  curriculum: [128, 256, 512]
  learning_rate: 1.0e-5
  temperature: 1.0
  per_device_batch_size: 2

target_metrics:
  retain_pct_of_teacher: 92
  vllm_throughput_speedup_a10: 6
